<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Steams</title>
        <link rel="icon" type="image/png" href="img/logo.png">
        <link rel="stylesheet" href="css/index.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
        <script src="js/supabaseclient.js" defer></script>
        <script src="js/data.js" defer></script>
        <script src="js/auth.js" defer></script>
        <script src="js/local.js" defer></script>
        <script src="js/chat.js" defer></script>
    </head>
    <body>
        <nav>
            <div class="nav-left">
                <a href="index.html"><img src="img/logo.png" alt="Logo Steams" class="nav-logo"></a>
                <a href="profile.html">Parametre profile</a>
            </div>
            <button id="logout-btn">Déconnexion</button>
        </nav>

        <table>
            <tr>
                <th>Conversation</th>
            </tr>
            <tr id="salon-row">
                <td class="chatCircle"><a href="contact.html">+</a></td>
            </tr>
        </table>
        <div class="chatSection">
            <div id="chat-messages-box">
            <p style="color: gray; font-style: italic;">Sélectionnez un salon pour commencer à clavarder...</p>
        </div>
        <div class="chatSection-bottom">
                <input type="text" placeholder="Entrer un message..." id="message-input">
                <button id="send-btn">Envoyer ➤</button>
                <button id="steam-share-btn">Partager mon Top 10</button>
            </div>
        </div>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steams - Configurer mon Profil</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabaseclient.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/local.js" defer></script>
    <script src="js/profile.js" defer></script>
</head>
<body>

    <div class="register-container">
        <img src="img/logo.png" alt="Logo Steams" class="auth-logo">
        <h2>Configurer mon Profil</h2>
        
        <form id="form-profile">
            <div class="input-group">
                <label for="profile-name">Nom</label>
                <input type="text" id="profile-name" placeholder="Entrez votre nom" required>
            </div>
            
            <div class="input-group">
                <label for="profile-bio">Biographie</label>
                <textarea id="profile-bio" placeholder="entrer bio" rows="4" style="width: 100%; border-radius: 4px; padding: 10px; border: 1px solid #ccc; font-family: sans-serif; box-sizing: border-box;"></textarea>
            </div>

            <div class="input-group" style="margin: 15px 0;">
                <button type="button" id="btn-link-steam">Lier mon compte Steam</button>
                <p id="steam-status">Aucun compte Steam lié</p>
            </div>
            
            <button type="submit" class="btn-submit">Enregistrer et Continuer</button>
        </form>

        <div class="links">
            <a href="./index.html">Aller au menu principal</a>
        </div>
    </div>

</body>
</html>
